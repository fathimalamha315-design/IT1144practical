<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #0078ff;
 color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 80%;
            margin: 20px auto;
            background: white;
            padding: 20px;   
			            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            background-color: #0078ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005ec7;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome!</h1>
    </header>

    <div class="container">
        <h2>My First HTML & CSS Page</h2>
        <p>This is a simple webpage created using HTML and CSS.</p>
        <button>Click Me</button>
    </div>

</body>
</html>
