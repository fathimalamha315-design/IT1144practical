<!DOCTYPE html>
<html>
<head>
    <title>Student Feedback Form</title>
</head>
<body>

    <h2>Student Feedback</h2>

    <form>

        <label>Student Name:</label><br>
        <input type="text"><br><br>

        <label>Class:</label><br>
        <select>
            <option>Grade 10</option>
            <option>Grade 11</option>
            <option>Grade 12</option>
        </select><br><br>

        <label>How do you rate the class?</label><br>
        <input type="radio" name="rating"> Excellent
        <input type="radio" name="rating"> Good
        <input type="radio" name="rating"> Average
        <br><br>

        <label>Subjects you like:</label><br>
        <input type="checkbox"> Maths
        <input type="checkbox"> Science
        <input type="checkbox"> English
        <br><br>

        <label>Suggestions:</label><br>
        <textarea rows="4" cols="30"></textarea><br><br>

        <button type="submit">Submit Feedback</button>

    </form>

</body>
</html>
